name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run notification patches
        run: node scripts/patch-expo-notifications.js

      - name: Expo prebuild
        run: npx expo prebuild --clean --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemindMe-v1.1.6-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.6
          name: RemindMe v1.1.6 (Google Pixel & Android 14/15 Lock Alarm Fix)
          body: |
            ### RemindMe v1.1.6
            - **Google Pixel Lock Screen Alarm Fix**: Uses native `AlarmManager.setAlarmClock` with Activity PendingIntent to wake screen and display `AlarmActivity` full-screen over the lock screen.
            - **BAL Exemption**: Grants official Background Activity Launch privileges on Android 14 and Android 15.
            - **Looping Alarm Audio**: Uses `RingtoneManager.TYPE_ALARM` with `USAGE_ALARM`.
            - **Snooze & Dismiss**: Complete keyguard security.
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
