name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --clean --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemindMe-v1.2.0-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: RemindMe v1.2.0 (Native Background Scheduler & Closed-App Repeats)
          body: |
            ### RemindMe v1.2.0
            - **Native Background Alarm Receiver**: Uses dedicated `ReminderAlarmReceiver` to guarantee notification delivery when the app is swiped away from Recent Apps.
            - **Closed-App Repeat & Interval Scheduling**: In-memory JavaScript dependence eliminated. Pure Kotlin native cycle calculation for interval, daily, and weekly reminders even when killed.
            - **Quiet Hours & Cutoff Enforcement**: Honors daily disabled time ranges and stopAt cutoff natively.
            - **Reboot Resilience**: Automatically re-arms all active reminders upon phone restart (`BootReceiver`).
            - **Lock Screen Privacy Intact**: Standard notification presentation preserves phone keyguard PIN/Fingerprint security.
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
